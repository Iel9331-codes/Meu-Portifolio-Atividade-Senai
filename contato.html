<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="css/contatoStyle.css">
</head>
<body>
    <h2>Informe seus dados para contato</h2>
    <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required><br><br>

        <label for="mensagem">Mensagem:</label><br>
<textarea id="mensagem" name="mensagem" rows="4" cols="50" placeholder="Digite sua mensagem aqui... informando a que me contata" required></textarea><br><br>

        <p><label><input type="checkbox" name="ok">        
        Aceito os termos</label></p>
        <input type="submit" value="Enviar">
        
     <a href="index.html"><br>Voltar para o menu de projetos</a>
</body>
</html>
